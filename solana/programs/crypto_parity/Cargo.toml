[package]
name = "crypto_parity"
version = "0.1.0"
description = "StableNaira CCTP — Phase 0 crypto-parity spike (keccak256 + secp256k1 vs EVM)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "crypto_parity"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.0.2"
solana-keccak-hasher = "3"
solana-secp256k1-recover = "3"

[dev-dependencies]
anchor-lang = "1.0.2"
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-instruction = "3.0.0"
solana-pubkey = "3.0.0"
# Independent EVM-side reference implementations for the parity gate.
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
libsecp256k1 = "0.7.1"
hex = "0.4.3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
